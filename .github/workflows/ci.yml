# Compile, test and format-check the SDK on every push and pull request, and
# run its agents behind a real zentinel binary.
#
# Elixir 1.18 is the floor: the gRPC dependencies (grpc_server, protobuf,
# googleapis) require it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "27"

jobs:
  test:
    name: Compile and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Test
        # test/integration/conformance_test.exs is excluded without
        # ZENTINEL_BIN; the conformance job below runs the same checks.
        run: mix test

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Check formatting
        run: mix format --check-formatted

  conformance:
    # The SDK's agents behind a real zentinel binary, through the shared
    # harness in zentinelproxy/zentinel (sdk-conformance/): handshake,
    # configure, header mutations, block, body inspection, reconnect, over
    # UDS and gRPC. Unit tests passed while no agent built with this SDK
    # could complete a handshake (zentinel#600); this is the check that
    # would have said so.
    name: Conformance (agent protocol v2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Build the SDK
        # Compiled up front so `mix run` starts the agents within the
        # harness's start timeout.
        run: mix deps.get && mix compile

      # Checked against the pinned Zentinel release. 26.10_8 is the first that
      # delivers the agent's `config { }` block (zentinel#603), which the
      # configure check needs.
      - name: Conformance agent (UDS + gRPC)
        uses: zentinelproxy/zentinel/sdk-conformance@main
        with:
          zentinel-version: 26.10_8
          agent-command: mix run examples/conformance_agent.exs --socket {socket}
          grpc-agent-command: mix run examples/conformance_agent.exs --grpc {grpc}

      - name: README quick-start agent
        uses: zentinelproxy/zentinel/sdk-conformance@main
        with:
          zentinel-version: 26.10_8
          profile: hello
          agent-command: mix run examples/hello_agent.exs {socket}
